services:
  mysql:
    image: mysql:8.4
    container_name: nano-url-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nano_url_db
      MYSQL_USER: nano_user
      MYSQL_PASSWORD: nano_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
